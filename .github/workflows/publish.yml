# После слияния в main пересобирает metadata.json, который читает Koda Desktop.
name: publish
on:
  push:
    branches: [main]
    paths: ["plugins/**", "scripts/**", "package-lock.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Закоммитить metadata.json
        run: |
          if git diff --quiet -- metadata.json; then echo "Каталог не изменился"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add metadata.json
          git commit -m "chore: update metadata.json"
          git push
